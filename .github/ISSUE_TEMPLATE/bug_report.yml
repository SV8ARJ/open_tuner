name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please fill in as much as you can. The maintainer will assign a milestone after triage.
  - type: dropdown
    id: release
    attributes:
      label: Release
      description: Which release are you using? The build is shown in the window title.
      options:
        - V0.B-dh1rk-beta6
        - V0.B-dh1rk-beta5
        - V0.B-dh1rk-beta4
        - V0.B-dh1rk-beta3
        - V0.B-net10-lowsr-beta2
        - V0.B-net10-lowsr-beta1
        - Self-built / other (please describe below)
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      description: Mainly tested are MiniTiouner Pro and MiniTiouner V2. Other hardware is welcome, but support is best effort.
      options:
        - MiniTiouner Pro (2 USB ports)
        - MiniTiouner V2 / E-Tiouner (1 USB port)
        - Other (please describe below)
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      description: How does the transport stream (TS) reach OpenTuner? Problems with network reception (packet loss, firewall, Wi-Fi) are a different class from USB problems.
      options:
        - USB (tuner directly at this PC)
        - Network, wired (Longmynd / WinterHill / Pico with Ethernet)
        - Network, Wi-Fi (Longmynd / WinterHill / Pico with Ethernet)
        - Not applicable / unsure
    validations:
      required: true
  - type: input
    id: signal
    attributes:
      label: Signal parameters
      description: Frequency, symbol rate, modulation / MODCOD, LNB, if relevant.
      placeholder: "e.g. 1255 MHz, 1000 kS, DVB-S2 QPSK 1/2"
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, other hardware details
      description: A screenshot of the Expert tab is often very helpful. You can drag files into this field.
